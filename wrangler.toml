# Baller Connection v6: Worker API + static app + D1 + cron. See DEPLOY.md.
name = "baller-connection"
main = "server/worker.ts"
compatibility_date = "2026-10-01"

# The built SPA (npm run build:worker) is served by the same Worker, so session cookies are first-party.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_URL = "https://baller-connection.YOUR-SUBDOMAIN.workers.dev"
EMAIL_PROVIDER = "resend"       # resend (default) | postmark | log. Without RESEND_API_KEY nothing leaves the server (mail is kept in the staff outbox).
EMAIL_FROM = "Baller Connection <coach@YOUR-DOMAIN>"   # must be on a domain verified with the provider (SPF + DKIM, see DEPLOY.md)
DEMO = "0"
# v6 Stripe price ids (test mode). Create them with: STRIPE_SECRET_KEY=sk_test_... npm run stripe:setup
STRIPE_PRICE_FOUNDATION = ""
STRIPE_PRICE_DEVELOPMENT = ""
STRIPE_PRICE_INNER_CIRCLE = ""
# v7 Web Push (optional; empty = log mode). Generate with: node scripts/vapid-keys.mjs. The private key goes in `wrangler secret put VAPID_PRIVATE_KEY`.
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = ""
# v8 Google sign-in (optional; empty = button explains it is not set up). Secret: `wrangler secret put GOOGLE_CLIENT_SECRET`. See DEPLOY.md 3b-g.
GOOGLE_CLIENT_ID = ""
# Secrets (never in this file):
#   wrangler secret put SESSION_SECRET
#   wrangler secret put RESEND_API_KEY        (or POSTMARK_SERVER_TOKEN)
#   wrangler secret put STRIPE_SECRET_KEY     (sk_test_… ; live keys are refused unless STRIPE_ALLOW_LIVE = "1")
#   wrangler secret put STRIPE_WEBHOOK_SECRET (whsec_… from the webhook endpoint)
# With no STRIPE_SECRET_KEY the app runs the built-in billing simulator (signed test events, no Stripe calls).

[[d1_databases]]
binding = "DB"
database_name = "baller-connection"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "server/migrations"

# v5 practice clips (≤30 s, ≤50 MB). Create once: npx wrangler r2 bucket create baller-connection-clips
# Keep the bucket private (no public access / r2.dev URL): clips are only served through /api/clips/:id after an access check.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "baller-connection-clips"

[triggers]
# every 15 min: SLA / overdue sweep + notification email digest. Sunday 23:00 UTC: weekly parent digests.
crons = ["*/15 * * * *", "0 23 * * SUN"]
